name: 🚀 Autonoma AI — 12-Agent Workforce 24/7 (Cloud Server)

on:
  # Uruchamia się automatycznie co 6 godzin na serwerach GitHuba (nawet gdy Twój laptop jest wyłączony)
  schedule:
    - cron: '0 */6 * * *'
  # Pozwala też uruchomić ręcznie jednym kliknięciem w zakładce "Actions" na GitHubie lub z telefonu
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-autonoma-workforce:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: 🐍 Konfiguracja Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🚀 Uruchomienie cyklu 12 Pracowników Autonoma AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python engine.py

      - name: 💾 Zapisanie nowych paczek 10 kanałów, pamięci i panelu WWW
        run: |
          git config --global user.name "Autonoma AI 24/7"
          git config --global user.email "agent@noreply.github.com"
          git add queue/ memory/ DASHBOARD.md public/ logs/
          git diff --staged --quiet || git commit -m "🤖 Autonoma AI: nowa paczka 10 kanałów wzrostu [skip ci]"
          git push
